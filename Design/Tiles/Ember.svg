<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="petal" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#b22a2d"/>
      <stop offset="0.55" stop-color="#d9433f"/>
      <stop offset="1" stop-color="#ee6a58"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d95a4e"/>
      <stop offset="1" stop-color="#a73232"/>
    </linearGradient>
    <clipPath id="inset"><rect x="34" y="34" width="188" height="188" rx="12"/></clipPath>
  </defs>

  <!-- Terracotta garden-bed edge: thin clay border -->
  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#clay)" stroke="#13212e" stroke-width="6"/>
  <!-- Tilled furrows running along the border band -->
  <g stroke="#8a2a2a" stroke-width="2.6" stroke-linecap="round" opacity="0.75">
    <path d="M40 15H216M40 25H216"/>
    <path d="M40 231H216M40 241H216"/>
    <path d="M15 40V216M25 40V216"/>
    <path d="M231 40V216M241 40V216"/>
  </g>
  <!-- Soft highlight on the top and left edges -->
  <path d="M34 11h188" stroke="#f08a76" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Seedlings planted in the furrows -->
  <g stroke="#13212e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <g id="sprout">
      <path d="M0 0v-6" fill="none"/>
      <path d="M0 -5c-8 -1 -10 -8 -9 -11c6 0 10 4 9 11z" fill="#6fb04f"/>
      <path d="M0 -5c8 -1 10 -8 9 -11c-6 0 -10 4 -9 11z" fill="#4f9440"/>
    </g>
  </g>
  <g stroke="#13212e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <use href="#sprout" transform="translate(80 17) rotate(180) scale(0.75)"/>
    <use href="#sprout" transform="translate(128 17) rotate(180) scale(0.75)"/>
    <use href="#sprout" transform="translate(176 17) rotate(180) scale(0.75)"/>
    <use href="#sprout" transform="translate(80 239) scale(0.75)"/>
    <use href="#sprout" transform="translate(128 239) scale(0.75)"/>
    <use href="#sprout" transform="translate(176 239) scale(0.75)"/>
    <use href="#sprout" transform="translate(17 80) rotate(90) scale(0.75)"/>
    <use href="#sprout" transform="translate(17 128) rotate(90) scale(0.75)"/>
    <use href="#sprout" transform="translate(17 176) rotate(90) scale(0.75)"/>
    <use href="#sprout" transform="translate(239 80) rotate(-90) scale(0.75)"/>
    <use href="#sprout" transform="translate(239 128) rotate(-90) scale(0.75)"/>
    <use href="#sprout" transform="translate(239 176) rotate(-90) scale(0.75)"/>
  </g>

  <!-- Wooden garden stakes at the four corners -->
  <g fill="#c58a4a" stroke="#13212e" stroke-width="3" stroke-linejoin="round">
    <rect x="12" y="12" width="26" height="26" rx="6"/>
    <rect x="218" y="12" width="26" height="26" rx="6"/>
    <rect x="12" y="218" width="26" height="26" rx="6"/>
    <rect x="218" y="218" width="26" height="26" rx="6"/>
  </g>
  <g stroke="#7a4a22" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M19 20h12M19 26h12M19 32h8"/>
    <path d="M225 20h12M225 26h12M225 32h8"/>
    <path d="M19 226h12M19 232h12M19 238h8"/>
    <path d="M225 226h12M225 232h12M225 238h8"/>
  </g>

  <!-- Cream inset -->
  <rect x="32" y="32" width="192" height="192" rx="14" fill="#6b4528" stroke="#13212e" stroke-width="5"/>
  <!-- Tilled soil: faint furrows and a few specks -->
  <g clip-path="url(#inset)">
    <g stroke="#53331b" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M40 62H216M40 96H216M40 160H216M40 194H216"/>
    </g>
    <g fill="#8a6038" opacity="0.8">
      <circle cx="58" cy="108" r="2.5"/><circle cx="196" cy="84" r="2.5"/><circle cx="70" cy="206" r="3"/>
      <circle cx="190" cy="150" r="2.5"/><circle cx="48" cy="150" r="2"/><circle cx="208" cy="206" r="2.5"/>
    </g>
  </g>

  <!-- Poppy -->
  <g clip-path="url(#inset)">
    <!-- Poppy leaves peeking from the inset corners -->
    <g fill="#5a9e45" stroke="#13212e" stroke-width="3" stroke-linejoin="round">
      <path d="M40 40c30 2 44 16 46 46c-30 -2 -44 -16 -46 -46z" transform="translate(0 0)"/>
      <path d="M216 40c-30 2 -44 16 -46 46c30 -2 44 -16 46 -46z"/>
      <path d="M40 216c30 -2 44 -16 46 -46c-30 2 -44 16 -46 46z"/>
      <path d="M216 216c-30 -2 -44 -16 -46 -46c30 2 44 16 46 46z"/>
    </g>
    <g stroke="#2f5a28" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M44 44L76 76M212 44L180 76M44 212L76 180M212 212L180 180"/>
    </g>
    <g stroke="#7a1f22" stroke-width="3" stroke-linejoin="round" fill="url(#petal)">
      <ellipse cx="128" cy="86" rx="46" ry="42" transform="rotate(-8 128 128)"/>
      <ellipse cx="170" cy="128" rx="42" ry="46" transform="rotate(8 128 128)"/>
      <ellipse cx="128" cy="170" rx="46" ry="42" transform="rotate(-6 128 128)"/>
      <ellipse cx="86" cy="128" rx="42" ry="46" transform="rotate(10 128 128)"/>
    </g>
    <!-- Petal veins -->
    <g stroke="#9c2227" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M128 70q-6 10 0 22M114 74q-8 8-6 18M142 74q8 8 6 18"/>
      <path d="M186 128q-10-6-22 0M182 114q-8-8-18-6M182 142q-8 8-18 6"/>
      <path d="M128 186q6-10 0-22M114 182q-8-8-6-18M142 182q8-8 6-18"/>
      <path d="M70 128q10 6 22 0M74 114q8 8 18 6M74 142q8-8 18-6"/>
    </g>
    <!-- Petal highlights -->
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="110" cy="66" rx="12" ry="6" transform="rotate(-25 110 66)"/>
      <ellipse cx="190" cy="108" rx="6" ry="12" transform="rotate(-20 190 108)"/>
      <ellipse cx="146" cy="190" rx="12" ry="6" transform="rotate(-20 146 190)"/>
      <ellipse cx="66" cy="148" rx="6" ry="12" transform="rotate(-15 66 148)"/>
    </g>
    <!-- Dark blotches at the petal bases -->
    <g fill="#2a1418" opacity="0.85">
      <ellipse cx="128" cy="104" rx="14" ry="10"/>
      <ellipse cx="152" cy="128" rx="10" ry="14"/>
      <ellipse cx="128" cy="152" rx="14" ry="10"/>
      <ellipse cx="104" cy="128" rx="10" ry="14"/>
    </g>
    <!-- Center: seed pod and stamens -->
    <g fill="#2a1418">
      <circle cx="128" cy="128" r="14"/>
      <circle cx="128" cy="104" r="2.6"/><circle cx="145" cy="111" r="2.6"/><circle cx="152" cy="128" r="2.6"/>
      <circle cx="145" cy="145" r="2.6"/><circle cx="128" cy="152" r="2.6"/><circle cx="111" cy="145" r="2.6"/>
      <circle cx="104" cy="128" r="2.6"/><circle cx="111" cy="111" r="2.6"/>
    </g>
    <circle cx="128" cy="128" r="14" fill="none" stroke="#6b3a30" stroke-width="2"/>
    <circle cx="123" cy="123" r="4" fill="#8a6a5a" opacity="0.7"/>
  </g>
</svg>
