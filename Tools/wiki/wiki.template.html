<title>LASTBLOOM Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ruled-paper notebook. Fixed left rail (grouped page list + search), one reading column, infobox floats right. Phone: rail becomes a drawer. */
/* Tokens come from the game itself (UITheme, VisualDefaults, generate_icons CAT_COLORS, generate_cards FRAME). See the "Guide de style" page. */
:root{
  --paper:#ecdfc3; --paper-2:#e2d1ab; --paper-3:#d6c49b; --card:#fff7e8; --rule:#cdbb91; --ink:#2a2420; --ink-soft:#5f5347;
  --poppy:#c8403f; --iris:#4f7fd0; --sun:#e8a82e; --fern:#5a9e45; --lavender:#8c63b0;
  --moutarde:#ffc53d; --ciel:#65aed6; --menthe:#a4ebcc; --coquelicot:#ff6b57;
  --pts:#2f8fe0; --mult:#e84d45; --pollen:#e8a82e;
  --r-common:#d9cdb0; --r-uncommon:#8fb8ee; --r-rare:#f2a56a; --r-legendary:#f7cf4a;
  --link:#2a5fb0; --hl:color-mix(in srgb,var(--moutarde) 42%,var(--card)); --shadow:rgba(42,36,32,.2);
  --poppy-bg:color-mix(in srgb,var(--poppy) 20%,var(--card)); --iris-bg:color-mix(in srgb,var(--iris) 20%,var(--card)); --sun-bg:color-mix(in srgb,var(--sun) 28%,var(--card)); --fern-bg:color-mix(in srgb,var(--fern) 22%,var(--card));
  --font-head:'Patrick Hand','Comic Sans MS',cursive; --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1f1a16; --paper-2:#292219; --paper-3:#352c21; --card:#2b241d; --rule:#46392b; --ink:#f1e7d0; --ink-soft:#bbad95;
  --poppy:#e0675f; --iris:#7aa2e6; --sun:#f0bd4a; --fern:#86c36f; --lavender:#b18bd6; --link:#8fb8ee; --shadow:rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#1f1a16; --paper-2:#292219; --paper-3:#352c21; --card:#2b241d; --rule:#46392b; --ink:#f1e7d0; --ink-soft:#bbad95;
  --poppy:#e0675f; --iris:#7aa2e6; --sun:#f0bd4a; --fern:#86c36f; --lavender:#b18bd6; --link:#8fb8ee; --shadow:rgba(0,0,0,.5); color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--font-body);-webkit-text-size-adjust:100%}
a{color:var(--link);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--iris);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:400;line-height:1.15;text-wrap:balance;margin:0;color:var(--ink)}
code,.mono{font-family:var(--font-mono);font-size:.86em}
code{background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:0 4px}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--paper-2);border-right:2px solid var(--ink);padding:18px 14px 28px max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);margin-bottom:14px}.brand img{flex:0 0 auto}
.brand b{font:400 28px/1 var(--font-head);letter-spacing:.02em;display:block}
.brand span{font-size:12.5px;color:var(--ink-soft)}
.search{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:2px solid var(--ink);border-radius:10px 12px 9px 11px;background:var(--card);color:var(--ink)}
.search::placeholder{color:var(--ink-soft)}
.navgroup{margin-top:18px}
.navgroup h4{font:400 13px/1 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin:0 0 6px 6px}
.rail nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15.5px;min-height:36px}
.rail nav a:hover{background:var(--paper-3)}
.rail nav a[aria-current="page"]{background:var(--hl);font-weight:600;box-shadow:inset 3px 0 0 var(--sun)}
.rail nav a small{font:500 12px var(--font-mono);color:var(--ink-soft)}
.topbar{display:none}

main{min-width:0;padding:30px max(28px,env(safe-area-inset-right,0px)) 80px 44px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,color-mix(in srgb,var(--rule) 55%,transparent) 31px,color-mix(in srgb,var(--rule) 55%,transparent) 32px);background-attachment:local}
.page{max-width:900px}
.crumb{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.page>h1{font-size:clamp(34px,5vw,50px);margin-bottom:6px}
.lead{font-size:18px;color:var(--ink-soft);max-width:62ch;margin:0 0 24px}
.page h2{font-size:30px;margin:38px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.page h3{font-size:22px;margin:24px 0 6px}
.page p,.page li{max-width:72ch}
.page ul,.page ol{padding-left:22px}
.page li{margin:3px 0}
.infobox{float:right;width:260px;margin:4px 0 16px 24px;border:2px solid var(--ink);border-radius:12px 10px 13px 9px;background:var(--card);padding:12px 14px;font-size:14.5px;box-shadow:3px 3px 0 var(--shadow)}
.infobox h4{font-size:18px;margin-bottom:6px}
.infobox dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.infobox dt{color:var(--ink-soft)}.infobox dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.callout{border:2px solid var(--ink);border-radius:11px 13px 10px 12px;padding:11px 15px;margin:16px 0;background:var(--sun-bg);max-width:72ch}
.callout.warn{background:var(--poppy-bg)}.callout.tip{background:var(--fern-bg)}.callout.info{background:var(--iris-bg)}
.callout b.t{font-family:var(--font-head);font-weight:400;font-size:18px;display:block;margin-bottom:2px}
.tablewrap{overflow-x:auto;margin:12px 0;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14.8px}
th,td{padding:7px 10px;border-bottom:1.5px solid var(--rule);text-align:left;vertical-align:top}
th{font:400 16px var(--font-head);background:var(--paper-2);border-bottom:2px solid var(--ink);white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--hl) 40%,transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--font-body);padding:2px 9px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);white-space:nowrap}
.chip.r-Common{background:var(--r-common);color:#2a2420}.chip.r-Uncommon{background:var(--r-uncommon);color:#2a2420}.chip.r-Rare{background:var(--r-rare);color:#2a2420}.chip.r-Legendary{background:var(--r-legendary);color:#2a2420}
.chip.pts{background:var(--pts);color:#fff;border-color:var(--ink)}.chip.mult{background:var(--mult);color:#fff}.chip.pol{background:var(--pollen);color:#2a2420}
.chip.poppy{background:var(--poppy-bg)}.chip.iris{background:var(--iris-bg)}.chip.sun{background:var(--sun-bg)}.chip.fern{background:var(--fern-bg)}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.dot.Poppy{background:var(--poppy)}.dot.Iris{background:var(--iris)}.dot.Sunflower{background:var(--sun)}.dot.Fern{background:var(--fern)}.dot.Joker{background:conic-gradient(var(--poppy) 0 25%,var(--iris) 0 50%,var(--sun) 0 75%,var(--fern) 0)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.tools input[type=search],.tools select{font:inherit;font-size:15px;padding:8px 11px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);min-height:40px}
.tools input[type=search]{flex:1 1 220px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.fchips button{font:inherit;font-size:14px;padding:6px 12px;min-height:36px;border:2px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--hl);font-weight:600}
.count{color:var(--ink-soft);font-size:14px;margin:4px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:10px 0}
.card{border:2px solid var(--ink);border-radius:12px 10px 13px 9px;background:var(--card);padding:11px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:2px 2px 0 var(--shadow)}
.card.hit{background:var(--hl);animation:blink 1.2s 2}
@keyframes blink{50%{box-shadow:0 0 0 4px var(--sun)}}
@media (prefers-reduced-motion:reduce){.card.hit{animation:none}}
.card h3{font-size:21px;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .meta{display:flex;flex-wrap:wrap;gap:5px}
.card p{margin:0;font-size:14.8px;max-width:none}
.card .unl{font-size:13.5px;color:var(--ink-soft);border-top:1.5px dashed var(--rule);padding-top:5px;margin-top:auto}
.card .id{font:12px var(--font-mono);color:var(--ink-soft)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}
.cats a{display:block;border:2px solid var(--ink);border-radius:12px 10px 13px 9px;padding:11px 14px;text-decoration:none;color:var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--shadow);min-height:56px}
.cats a:hover{background:var(--hl)}
.cats b{font:400 21px var(--font-head);display:block}.cats span{font-size:14px;color:var(--ink-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;background:var(--paper-2)}
.stat b{font:400 32px/1 var(--font-head);display:block}.stat span{font-size:13px;color:var(--ink-soft)}
.hero{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:0 0 6px}
.hero img{max-width:100%;height:auto}
.banner{height:84px;background-size:cover;background-position:center;border-bottom:2px solid var(--ink);position:relative;margin:-11px -14px 4px;border-radius:10px 8px 0 0}
.banner .pic{position:absolute;left:12px;bottom:-26px;background-color:var(--card);border:2px solid var(--ink);border-radius:12px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}
.sw div{border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card);font-size:13.5px}
.sw i{display:block;height:54px;border-bottom:2px solid var(--ink)}
.sw b{display:block;font:400 17px var(--font-head);padding:4px 8px 0}.sw div>code{margin:2px 8px 6px;display:inline-block}
.btn{font:inherit;font-size:15px;padding:9px 16px;min-height:44px;border:2px solid var(--ink);border-radius:11px 10px 12px 9px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.btn.gold{background:var(--moutarde)}.btn.green{background:var(--menthe)}
.shapes{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}
.shape{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink-soft)}
.bars{display:grid;gap:7px;margin:12px 0;max-width:620px}
.bar{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:20px;border:2px solid var(--ink);border-radius:6px;background:var(--paper-2);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--fern);display:block}
.bar b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{font:400 18px var(--font-head);padding:6px 14px;min-height:40px;border:2px solid var(--ink);border-radius:10px 10px 0 0;background:var(--paper-2);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--hl)}
details{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card);max-width:72ch}
summary{cursor:pointer;font:400 19px var(--font-head);min-height:32px}
.ev{margin-bottom:18px}
.ev .story{font-style:italic;color:var(--ink-soft);margin:4px 0 8px}
.opt{margin:6px 0 6px 0;padding-left:12px;border-left:4px solid var(--sun)}
.opt .o{display:block;font-size:14.5px;color:var(--ink-soft)}
.pic{flex:0 0 auto;display:inline-block;vertical-align:middle;background-repeat:no-repeat}
.ico{flex:0 0 auto;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;border:3px solid var(--ink-soft);font:400 18px/1 var(--font-head);color:var(--ink);background:var(--sun-bg)}
.ico.poppy{background:var(--poppy-bg)}.ico.iris{background:var(--iris-bg)}.ico.fern{background:var(--fern-bg)}.ico.sun{background:var(--sun-bg)}
.ico.r-Uncommon{border-color:var(--fern)}.ico.r-Rare{border-color:var(--iris)}.ico.r-Legendary{border-color:var(--sun);box-shadow:0 0 0 2px var(--ink)}
.ico.big{width:64px;height:64px;font-size:28px;border-radius:13px}
.ico.sm{width:30px;height:30px;font-size:14px;border-width:2.5px;border-radius:7px}
.card h3 a,td a.nm{color:var(--ink);text-decoration:none}.card h3 a:hover,td a.nm:hover{text-decoration:underline}
.card .head{display:flex;gap:10px;align-items:center}
.card .head h3{flex:1;min-width:0}
.nm{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.view{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.view button{font:inherit;font-size:14px;padding:7px 14px;min-height:40px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.view button[aria-pressed="true"]{background:var(--hl);font-weight:600}
th button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
th button[data-dir="1"]::after{content:"▲";font-size:10px}th button[data-dir="-1"]::after{content:"▼";font-size:10px}
.toc{border:2px solid var(--ink);border-radius:11px 13px 10px 12px;padding:10px 16px;margin:0 0 22px;background:var(--paper-2);max-width:420px;font-size:15px}
.toc b{font:400 18px var(--font-head);display:block;margin-bottom:2px}
.toc ol{margin:0;padding-left:20px}.toc a{text-decoration:none}.toc a:hover{text-decoration:underline}
.crumb a{color:var(--ink-soft)}
.pager{display:flex;justify-content:space-between;gap:10px;margin:28px 0 6px;flex-wrap:wrap}
.pager a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none}
.pager a:hover{background:var(--hl)}
.see{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.see a{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 5px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--card);min-height:40px}
.see a:hover{background:var(--hl)}
.desc-big{font-size:19px;line-height:1.5;max-width:60ch;margin:0 0 16px}
.navbox{margin-top:36px;border:2px solid var(--ink);border-radius:11px;background:var(--paper-2);max-width:none}
.navbox summary{font:400 18px var(--font-head);padding:2px 0}
.navbox .nbg{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;align-items:baseline;margin-top:8px;font-size:14.5px}
.navbox .nbg b{font:400 16px var(--font-head);color:var(--ink-soft)}
.navbox .nbg div a{margin-right:10px;white-space:nowrap}
#sres{margin-top:10px}
#sres a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);min-height:44px}
#sres a:hover,#sres a.sel{background:var(--hl)}
#sres a span:not(.ico){flex:1;min-width:0}#sres a small{color:var(--ink-soft);font-size:12.5px}
#sres .all{font-size:14px;color:var(--link);justify-content:center;border:2px dashed var(--rule)}
.results h2{border:0;margin-top:20px}
.results a.r{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:2px solid var(--ink);border-radius:10px;margin:6px 0;text-decoration:none;color:var(--ink);background:var(--card);min-height:44px}
.results a.r:hover{background:var(--hl)}
.results small{color:var(--ink-soft)}
footer{margin-top:50px;padding-top:14px;border-top:2px solid var(--ink);font-size:13.5px;color:var(--ink-soft);max-width:72ch}
.theme{margin-top:20px;font:inherit;font-size:14px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;min-height:40px}

@media (max-width:900px){
  .shell{display:block}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper-2);border-bottom:2px solid var(--ink);align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper-2);z-index:30}
  .topbar b{font:400 24px var(--font-head)}
  .topbar button{margin-left:auto;font:inherit;font-weight:600;padding:8px 14px;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
  .rail{display:none;position:fixed;inset:0;z-index:25;height:auto;width:100%;border-right:0;padding-top:calc(60px + env(safe-area-inset-top,0px))}
  .rail.open{display:block}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}
  .infobox{float:none;width:auto;margin:0 0 16px}
  .bar{grid-template-columns:78px 1fr 48px}
}
</style>

<div class="topbar"><b>LASTBLOOM</b><button id="menuBtn" aria-expanded="false" aria-controls="rail">Menu</button></div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var C=D.c, E=C.E, S=C.S, R=C.R;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pct(x,t){return Math.round(100*x/t)}
var COLORS=[['Poppy','Coral','poppy'],['Iris','Teal','iris'],['Sunflower','Violet','sun'],['Fern','Lime','fern']];
var CAT_FR={'Couleurs':'Couleurs','Voisinage':'Voisinage','Connexions':'Connexions','Formes':'Formes','Destruction':'Destruction','Tempo':'Tempo','Upgrades':'Upgrades','Weather':'Weather','Seed Bag':'Seed Bag','Flat':'Flat','Enemies':'Enemies','Wild':'Wild','Synergy':'Synergy'};
var CAT_NOTE={'Couleurs':'jouer ou éviter certaines couleurs','Voisinage':'ce qui touche la graine posée','Connexions':'taille et forme des groupes','Formes':'la forme des graines','Destruction':'récolte de lignes','Tempo':'rythme de la manche','Upgrades':'tile upgrades possédées','Weather':'la météo du jour','Seed Bag':'composition du sac','Flat':'Mult plat','Enemies':'les nuisibles','Wild':'Jokers','Synergy':'liens entre fertilizers'};
var RAR_CLASS={'Common':'','Uncommon':'fern','Rare':'iris','Legendary':'sun'};
function enemyById(id){for(var i=0;i<D.enemies.length;i++)if(D.enemies[i].id===id)return D.enemies[i];return null}
function enemyName(id){var e=enemyById(id);return e?e.name:id}
function enemyLink(id){return '<a href="#ennemis-'+id+'">'+esc(enemyName(id))+'</a>'}
function chip(t,cls){return '<span class="chip '+(cls||'')+'">'+esc(t)+'</span>'}
function callout(title,html,cls){return '<div class="callout '+(cls||'')+'"><b class="t">'+esc(title)+'</b>'+html+'</div>'}
function table(head,rows,numCols){
  var h='<div class="tablewrap"><table><thead><tr>';
  head.forEach(function(x,i){h+='<th'+(numCols&&numCols.indexOf(i)>=0?' class="n"':'')+'>'+x+'</th>'});
  h+='</tr></thead><tbody>';

function ico(name,cat,rar,size){

function sortBy(list,s){
  var k=s.key,d=s.dir;

    if(k==='price'){x=a.price;y=b.price}else if(k==='rar'){x=RAR_ORDER[a.rar];y=RAR_ORDER[b.rar]}else if(k==='cat'){x=a.cat;y=b.cat}else if(k==='lock'){x=a.unlock?1:0;y=b.unlock?1:0}else{x=a.name;y=b.name}

    return (c||a.name.localeCompare(b.name))*d;
  });
}

}
function seeAlso(items,page){

P.interface=function(){
  var h='<div class="crumb">Production</div><h1>Interface et direction artistique</h1><p class="lead">Tout le jeu est dessiné comme un cahier : papier ligné, traits d’encre doublés ou triplés, aplats de crayon de couleur.</p>';
  h+='<h2>Direction artistique</h2><ul><li><b>Style « notebook / scratch »</b> : contours à l’encre triples, remplissages décalés, hachures. Police manuscrite Patrick Hand.</li><li><b>Flipbook</b> : les ennemis, le logo, Sprig, le bouclier, l’icône de Pollen et le décor alternent trois dessins (0-1-2-1, toutes les 0,14 s) pour donner le tremblé des vieux dessins animés. Le mouvement réduit les fige.</li><li><b>Fertilizers</b> : cartes dont le cadre dit la rareté et le ruban la catégorie. <b>Sprouts</b> : pastilles à glyphe.</li><li><b>Sprig</b>, la mascotte : un pot de fleur en terre cuite avec une pousse, sans bras ni jambes ; il a quatre expressions (neutre, content, triste, en fête).</li><li><b>Transition de page</b> : après le choix d’un challenge et après Continue, une vague de gribouillis et de fleurs recouvre l’écran puis le découvre.</li></ul>';
  h+='<h2>Écrans</h2><ul><li><b>Menu principal</b> : Play (doré), Continue (vert, avec « Spring - round N » ou « shop after round N »), « New run » et Collection, engrenage des réglages en haut à droite, ligne de progression (meilleur score, runs, prochain objectif). Fond animé.</li><li><b>Jeu</b> : colonne de gauche (score points × Mult, panneau Fertilizers, Seed Bag, Menu), grille au centre, main à droite, bande des ennemis et météo en haut.</li><li><b>Boutique</b> : deux étagères, bulle de Sprig, enseigne.</li><li><b>Collection</b> : fertilizers, upgrades, ennemis, météos et graines découverts, avec une barre de progression.</li><li><b>Fin de manche et de run</b> : résumé de manche ; records de la run (plus grosse pose, Mult maximal, plus gros groupe, lignes récoltées, fertilizer le plus déclenché).</li></ul>';
  h+='<h2>Tactile d’abord</h2><p>Le jeu est testé sur iPad via des builds itch.io. Donc : un seul doigt, aucune interaction au survol, cibles d’au moins 56 unités, infobulles ouvertes par un appui et refermées par un appui ailleurs.</p>';
  h+='<h2>Retours et accessibilité</h2><ul><li>Popups de score, animations de récolte, de déracinement, d’effritement et de vol des fertilizers ; sons.</li><li><b>Mouvement réduit</b> désactive toute animation décorative.</li><li>Textes agrandis de 25 %, halo clair sous les textes sur fond sombre.</li><li>Vie au repos : créatures et particules propres à chaque challenge, scintillements, reflet qui traverse le jardin après 8 secondes sans pose.</li></ul>';
  h+='<h2>Plateformes</h2><p>iPad et tablette (cible principale), navigateur WebGL (écran de chargement redessiné dans le même style), desktop.</p>';
  return h;
};

P.equilibrage=function(){
  var h='<div class="crumb">Production</div><h1>Équilibrage</h1><p class="lead">Les chiffres sont mesurés avec un simulateur qui joue des milliers de parties, pas devinés.</p>';
  h+='<h2>Victoires du planner (26 nov. 2026)</h2><p>Planner de profondeur 2, 400 parties, graine 1. Le bruit à 100 parties est de ±4 points : on mesure avec 400.</p><div class="bars">';
  [['Spring',15],['Winter',12.5],['Summer',7],['Autumn',16],['Orchard',8],['Greenhouse',6.75]].forEach(function(r){h+='<div class="bar"><span>'+r[0]+'</span><i><u style="width:'+Math.min(100,r[1]*4)+'%"></u></i><b>'+r[1]+' %</b></div>'});
  h+='</div><p>Le levier de réglage est <code>LateHpMultiplier</code> (PV des ennemis à partir de la manche 4).</p>';
  h+='<h2>Spring, manche par manche</h2><p>Part des parties qui atteignent la manche N et la réussissent (planner, 400 parties).</p><div class="bars">';
  [['Manche 1',100],['Manche 2',74],['Manche 3',90],['Manche 4',64],['Manche 5',84],['Manche 6',83]].forEach(function(r){h+='<div class="bar"><span>'+r[0]+'</span><i><u style="width:'+r[1]+'%"></u></i><b>'+r[1]+' %</b></div>'});
  h+='</div>';
  h+=callout('Le mur du Locker','<p>Les manches 2 et 4 (Bramble) coûtaient 31 % des parties chacune. Essais : second verrou toutes les 9 graines au lieu de 6 (aucun effet), Bramble à 450 PV au lieu de 600 (peu d’effet). Le goulot est le <b>nombre de graines</b>, parce que les verrous empêchent les lignes de se compléter. Retenu : +4 graines en manche 2 et +4 en manche 4.</p>','warn');
  h+='<h2>Décisions de rythme récentes</h2><ul><li><b>Manche 1 raccourcie</b> : '+R.FirstRoundBudget+' graines (au lieu de 30), ennemi à 50 % de ses PV, prime de '+R.FirstRoundPollenBonus+' Pollen. Elle passe d’environ 17 poses à environ 10.</li><li><b>Le Mult n’est jamais arrondi</b> : ni dans le calcul ni dans l’affichage.</li><li><b>Événements</b> toutes les 3 manches : sans effet mesurable sur les victoires (Spring 13,0 %, Winter 11,3 % avec un bot qui répond au hasard).</li><li><b>Pas d’aide au joueur</b> : ni indice, ni tirage favorisé. Décision explicite de l’auteur.</li></ul>';
  h+='<h2>Où vivent les chiffres</h2>'+table(['Quoi','Fichier'],[['Graines et quotas par manche','<code>Core/Run/RunConfig.cs</code>, <code>ChallengeCatalog.cs</code>'],['Ennemis par manche','<code>Core/Enemies/EncounterCatalog.cs</code>'],['PV, rôle, texte des ennemis','<code>Core/Enemies/EnemyCatalog.cs</code>'],['Constantes de score','<code>Core/Scoring/ScoringConstants.cs</code>'],['Prix et économie','<code>Core/Economy/*</code>'],['Effets des fertilizers','<code>Core/Grid/*</code>, <code>Core/Modifiers/ModifierDefinition.cs</code>']]);
  h+='<h2>Mesurer avant de toucher</h2><div class="callout info"><code>cd Tools/Headless/RunSim &amp;&amp; PLAN_DEPTH=2 dotnet run -c Release -- --runs 400 --policy planner --seed 1 --challenge Spring</code></div><p>Le bot est plus faible qu’un bon joueur : ses chiffres servent à <b>comparer avant et après</b>, pas à estimer le niveau d’un humain.</p>';
  return h;
};

P.outils=function(){
  var h='<div class="crumb">Production</div><h1>Outils et conventions</h1><p class="lead">Le jeu est en C# sous Unity. Sa logique tourne aussi sans Unity, ce qui permet de la tester et de la simuler.</p>';
  h+='<h2>Architecture</h2><ul><li><b>Core</b> : logique pure (pas de MonoBehaviour), testée sans Unity. Grille, score, boutique, upgrades, run, ennemis, événements.</li><li><b>Data</b> : défauts visuels (sprites, couleurs) liés aux ids du Core.</li><li><b>Presentation</b> : uGUI construit entièrement à l’exécution, sans prefab ni scène à la main. Seul le CI Unity la compile.</li></ul>';
  h+='<h2>Commandes</h2>'+table(['But','Commande'],[['Tests du Core (environ 670)','<code>cd Tools/Headless/Tests &amp;&amp; dotnet test</code>'],['Simulateur','<code>cd Tools/Headless/RunSim &amp;&amp; dotnet run -- --check --runs N --policy random|planner --seed S</code>'],['Rythme de déblocage','<code>--locked</code>, <code>--coverage</code>, <code>--calibrate --calibration-out f.csv</code>'],['Audits de contenu','<code>python3 Tools/qa/content_audit.py</code>, <code>glyph_audit.py</code>'],['Pastilles des icônes','<code>python3 Tools/check_icon_tags.py</code> (dans le CI)']]);
  h+='<h2>Conventions</h2><ul><li>Ids sauvegardés en entiers : on ne supprime jamais un membre d’enum (on le retire du catalogue et on le convertit à la reprise).</li><li>Toute animation décorative passe par <code>MotionSettings.Reduced</code>.</li><li>Tout nouvel asset ou <code>.cs</code> a besoin d’un <code>.meta</code> avec un nouveau guid.</li><li>Toute modification du texte ou d’un chiffre de fertilizer relance <code>check_icon_tags.py</code>.</li></ul>';
  h+='<h2>Pipeline d’art</h2><p>Les SVG sont générés par les scripts de <code>Design/Notebook/</code> (encrage à la main avec <code>ink.py</code>, puis <code>inkify.py</code> pour les icônes), rendus en PNG avec Chromium et Playwright. Les variantes <code>_1</code> et <code>_2</code> alimentent les flipbooks.</p>';
  h+='<h2>Points ouverts</h2><ul><li><b>Undo d’une pose</b> : non fait. Le Core n’a pas de copie profonde de l’état d’une manche ; un vrai Undo demande une décision de conception.</li><li>Bug mobile du bouton Seed bag jamais élucidé (soupçon : le bouton Sell le recouvre).</li><li>Build WebGL à régénérer pour rejouer les scénarios de QA, puis une passe QA sur les nouveautés.</li><li>Localisation : les textes sont en anglais.</li></ul>';
  return h;
};


P.guide=function(){
  function sw(name,hex,note){return '<div><i style="background:'+hex+'"></i><b>'+name+'</b><code>'+hex+'</code>'+(note?'<span style="display:block;padding:0 8px 6px;color:var(--ink-soft)">'+note+'</span>':'')+'</div>'}
  var h='<div class="crumb"><a href="#accueil">Wiki</a> › Production</div><h1>Guide de style</h1><p class="lead">La source de vérité visuelle du wiki. Rien n’est inventé : chaque valeur vient du jeu (<code>UITheme</code>, <code>VisualDefaults</code>, les générateurs d’icônes). Une page du wiki n’utilise que ces variables.</p>';
  h+='<h2>Principes</h2><ul><li><b>Le cahier du jardin.</b> Papier ligné, encre brune, aplats de crayon. Le wiki est une page du même cahier que le jeu.</li><li><b>Les images viennent du jeu.</b> Icônes de fertilizers, d’ennemis, de météo : les vrais PNG, jamais une illustration refaite pour le wiki.</li><li><b>Une couleur dit toujours la même chose.</b> Points en bleu, Mult en rouge, Pollen en or ; la rareté par la couleur du cadre ; la catégorie par la couleur du ruban.</li><li><b>Tactile.</b> Cibles d’au moins 40 px, aucun survol nécessaire.</li><li><b>On change le guide, pas les pages.</b> Une couleur ou un arrondi se corrige ici, à un seul endroit.</li></ul>';
  h+='<h2>Surfaces et encre</h2><div class="sw">'+sw('Papier cahier','#ecdfc3','fond de page (<code>UITheme.Background</code>)')+sw('Carton crème','#fff7e8','cartes, boîtes, boutons (<code>Panel</code>)')+sw('Encre','#2a2420','texte et contours (<code>Ink</code>)')+sw('Moutarde','#ffc53d','sélection, bouton principal')+sw('Ciel','#65aed6','liens d’interface, Voisinage')+sw('Menthe','#a4ebcc','succès, bouton Continue')+sw('Coquelicot','#ff6b57','danger')+'</div>';
  h+='<h2>Les quatre couleurs de graines</h2><div class="sw">'+sw('Poppy','#c8403f','Coral dans le code')+sw('Iris','#4f7fd0','Teal')+sw('Sunflower','#e8a82e','Violet')+sw('Fern','#5a9e45','Lime')+sw('Lavender','#8c63b0','Joker')+'</div>';
  h+='<h2>Le score a une couleur par sorte</h2><div class="sw">'+sw('Points','#2f8fe0','bleu')+sw('Mult','#e84d45','rouge')+sw('Pollen','#e8a82e','or')+'</div><p><span class="chip pts">+120 points</span> <span class="chip mult">+2,6 Mult</span> <span class="chip pol">+8 Pollen</span></p>';
  h+='<h2>Rareté : la couleur du cadre de la carte</h2><div class="sw">'+sw('Common','#d9cdb0','crème')+sw('Uncommon','#8fb8ee','bleu')+sw('Rare','#f2a56a','orange')+sw('Legendary','#f7cf4a','or')+'</div><p>'+['Common','Uncommon','Rare','Legendary'].map(rarChip).join(' ')+'</p>';
  h+='<h2>Catégories : la couleur du ruban</h2><div class="sw">'+Object.keys(CAT_HEX).map(function(c){return sw(c,CAT_HEX[c])}).join('')+'</div><p>'+Object.keys(CAT_HEX).map(catChip).join(' ')+'</p><p>Le texte d’une pastille prend l’encre ou le crème selon la luminosité du fond : jamais de texte clair sur une couleur claire.</p>';
  h+='<h2>Typographie</h2>'+table(['Rôle','Police','Taille','Exemple'],[['Titres','Patrick Hand','34 à 50 px','<span style="font:400 34px var(--font-head)">Fertilizers</span>'],['Sections','Patrick Hand','30 px, filet d’encre dessous','<span style="font:400 24px var(--font-head)">Maturation</span>'],['Texte','Source Sans 3','16 px, ligne 1,6, 65 caractères au plus','Un fertilizer se tient avec trois autres au plus.'],['Données','JetBrains Mono','0,86 em','<code>MegaChaine</code>']])+'<p>Le jeu agrandit tous ses textes de 25 % parce que la manuscrite est petite ; le wiki garde un texte courant à 16 px et réserve la manuscrite aux titres, ce qui garde les longues descriptions lisibles.</p>';
  h+='<h2>Composants</h2><h3>Boutons et pastilles</h3><p><button class="btn gold" type="button">Play</button> <button class="btn green" type="button">Continue</button> <button class="btn" type="button">Collection</button> <span class="chip">neutre</span> '+chip('Pollen','sun')+'</p>';
  h+='<h3>Carte d’objet</h3><div class="cards" style="max-width:360px"><article class="card"><div class="head">'+pic(['fert|Macon'],56)+'<h3><a href="#fertilizers-Macon">Mason</a><span class="chip sun">4 Pollen</span></h3></div><div class="meta">'+catChip('Destruction')+rarChip('Common')+'</div><p>+2 Mult when no row/column is completed.</p><div class="unl">Disponible dès le départ</div></article></div>';
  h+='<h3>Boîtes</h3>'+callout('Information','<p>Pour une précision, un renvoi.</p>','info')+callout('Astuce','<p>Pour un conseil de jeu confirmé.</p>','tip')+callout('Attention','<p>Pour un piège ou une règle surprenante.</p>','warn')+callout('Note','<p>Pour une décision de conception.</p>');
  h+='<h3>Contours</h3><p>Contour d’encre de 2 px, coins légèrement irréguliers (<code>12px 10px 13px 9px</code>), ombre portée dure de 2 à 3 px décalée vers le bas à droite. Pas de dégradé, pas de flou.</p>';
  h+='<h2>À faire et à éviter</h2>'+table(['À faire','À éviter'],[['Utiliser les vraies icônes du jeu','Redessiner ou remplacer une icône'],['Une couleur = un sens (score, rareté, catégorie)','Une couleur décorative qui ressemble à une couleur de sens'],['Variables du guide partout','Une valeur de couleur codée à la main dans une page'],['Texte d’encre sur papier, crème sur fond foncé','Texte gris clair sur papier'],['Cartes à cadre d’encre et ombre dure','Ombres floues, dégradés violet-bleu, coins très ronds uniformes']]);
  h+='<h2>Variables CSS</h2><pre style="background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px">--paper:#ecdfc3; --card:#fff7e8; --ink:#2a2420;\n--poppy:#c8403f; --iris:#4f7fd0; --sun:#e8a82e; --fern:#5a9e45; --lavender:#8c63b0;\n--moutarde:#ffc53d; --ciel:#65aed6; --menthe:#a4ebcc; --coquelicot:#ff6b57;\n--pts:#2f8fe0; --mult:#e84d45; --pollen:#e8a82e;\n--r-common:#d9cdb0; --r-uncommon:#8fb8ee; --r-rare:#f2a56a; --r-legendary:#f7cf4a;</pre><p>Le mode sombre (« papier de nuit ») n’existe pas dans le jeu : il reprend les mêmes teintes, assombries, avec un texte crème. C’est le seul écart du wiki par rapport au guide du jeu.</p>';
  return h;
};

/* ---------- Search ---------- */
var INDEX=[];
D.fert.forEach(function(f){INDEX.push({t:f.name,k:'Fertilizer',p:'fertilizers-'+f.id,x:f.name+' '+f.desc+' '+f.id+' '+(f.unlock||''),i:pic(['fert|'+f.id],30,ico(f.name,f.cat,f.rar,'sm'))})});
D.sprouts.forEach(function(f){INDEX.push({t:f.name,k:'Tile upgrade',p:'sprouts-'+f.id,x:f.name+' '+f.desc+' '+(f.unlock||''),i:pic(['spr|'+f.id],30,ico(f.name,'',f.rar,'sm'))})});
D.enemies.forEach(function(f){INDEX.push({t:f.name,k:'Ennemi',p:'ennemis-'+f.id,x:f.name+' '+f.desc+' '+f.lore+' '+f.id,i:pic(['misc|e:'+f.id],30,ico(f.name,'Enemies','Common','sm'))})});
D.weather.forEach(function(f){INDEX.push({t:f.name,k:'Météo',p:'meteo',x:f.name+' '+f.desc,i:pic(['misc|w:'+f.id],30,ico(f.name,'Weather','Common','sm'))})});
D.events.forEach(function(f){INDEX.push({t:f.title,k:'Événement',p:'evenements-'+f.id,x:f.title+' '+f.story,i:ico(f.title,'Wild','Common','sm')})});
D.challenges.forEach(function(f){INDEX.push({t:f.name,k:'Challenge',p:'challenges-'+f.name,x:f.name+' '+f.desc,i:pic(['misc|c:'+f.name],30,ico(f.name,'Voisinage','Rare','sm'))})});
D.other.concat(D.packs).forEach(function(f){INDEX.push({t:f.name,k:'Upgrade',p:'upgrades',x:f.name+' '+f.desc,i:pic(['spr|'+f.id,'misc|x:'+f.id],30,ico(f.name,'Upgrades','Uncommon','sm'))})});
Object.keys(TITLES).forEach(function(k){INDEX.push({t:TITLES[k],k:'Page',p:k,x:TITLES[k],i:ico(TITLES[k],'Flat','Common','sm')})});
function searchRes(q){
  var words=q.toLowerCase().split(/\s+/).filter(Boolean);
  var res=INDEX.filter(function(r){var x=(r.x||'').toLowerCase();return words.every(function(w){return x.indexOf(w)>=0})});
  res.sort(function(a,b){var an=a.t.toLowerCase().indexOf(words[0])===0?0:1,bn=b.t.toLowerCase().indexOf(words[0])===0?0:1;return an-bn||a.t.localeCompare(b.t)});
  return res;
}
function searchPage(q){
  var res=searchRes(q);
  var h='<div class="results"><div class="crumb"><a href="#accueil">Wiki</a> › Recherche</div><h1>« '+esc(q)+' »</h1><p class="count">'+res.length+' résultat'+(res.length>1?'s':'')+(res.length>80?' (80 premiers affichés)':'')+'</p>';
  res.slice(0,80).forEach(function(r){h+='<a class="r" href="#'+r.p+'"><span class="nm">'+r.i+esc(r.t)+'</span><small>'+esc(r.k)+'</small></a>'});
  if(!res.length)h+='<p>Rien trouvé. Essaie un nom de fertilizer, d’ennemi ou un mot de la description.</p>';
  return h+'</div>';
}

/* ---------- Router ---------- */
var pageEl=document.getElementById('page'),navEl=document.getElementById('nav'),rail=document.getElementById('rail'),sres=document.getElementById('sres');
function buildNav(cur){
  var h='';NAV.forEach(function(g){h+='<div class="navgroup"><h4>'+g[0]+'</h4>';g[1].forEach(function(p){h+='<a href="#'+p[0]+'"'+(p[0]===cur?' aria-current="page"':'')+'>'+esc(p[1])+(p[2]?'<small>'+p[2]+'</small>':'')+'</a>'});h+='</div>'});
  navEl.innerHTML=h;
}
function navbox(){
  var h='<details class="navbox"><summary>Toutes les pages</summary><div class="nbg">';
  NAV.forEach(function(g){h+='<b>'+g[0]+'</b><div>'+g[1].map(function(p){return '<a href="#'+p[0]+'">'+esc(p[1])+'</a>'}).join('')+'</div>'});
  return h+'</div></details>';
}
function addToc(){
  var hs=pageEl.querySelectorAll('h2');
  if(hs.length<4||pageEl.querySelector('.cards,.results'))return;
  var lead=pageEl.querySelector('.lead');if(!lead)return;
  var h='<nav class="toc" aria-label="Sur cette page"><b>Sur cette page</b><ol>';
  Array.prototype.forEach.call(hs,function(el,i){el.id='sec'+i;h+='<li><a href="#" data-to="sec'+i+'">'+esc(el.textContent)+'</a></li>'});
  var box=document.createElement('div');box.innerHTML=h+'</ol></nav>';
  lead.insertAdjacentElement('afterend',box.firstChild);
  pageEl.querySelector('.toc').addEventListener('click',function(e){var a=e.target.closest('a[data-to]');if(!a)return;e.preventDefault();document.getElementById(a.getAttribute('data-to')).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});
}
var ITEMS={fertilizers:[D.fert,itemFert],sprouts:[D.sprouts,itemSprout],ennemis:[D.enemies,itemEnemy]};
function route(){
  var hash=location.hash.replace(/^#/,'')||'accueil';
  var i=hash.indexOf('-'),pg=i<0?hash:hash.slice(0,i),item=i<0?'':hash.slice(i+1);
  if(!P[pg]){pg='accueil';item=''}
  buildNav(pg);
  var body=null;
  if(item&&ITEMS[pg]){var k=findBy(ITEMS[pg][0],item);if(k>=0){body=ITEMS[pg][1](ITEMS[pg][0][k]);document.title=ITEMS[pg][0][k].name+' · LASTBLOOM Wiki'}}
  if(body===null){body=P[pg]();document.title=(TITLES[pg]||'LASTBLOOM')+' · LASTBLOOM Wiki'}
  pageEl.innerHTML=body+navbox()+'<footer>LASTBLOOM · wiki de conception. Listes générées depuis le code du dépôt le 26 novembre 2026 ; le texte d’explication vient de <code>docs/</code>.</footer>';
  if(P[pg].after&&!(item&&ITEMS[pg]&&findBy(ITEMS[pg][0],item)>=0))P[pg].after();
  addToc();
  rail.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  var target=item&&!ITEMS[pg]?document.getElementById({evenements:'ev-',challenges:'c-'}[pg]+item):null;
  if(target){target.scrollIntoView({block:'center'});if(target.classList.contains('card'))target.classList.add('hit')}
  else window.scrollTo(0,0);
}
window.addEventListener('hashchange',function(){closeSearch();route()});
var q=document.getElementById('q'),sel=-1,cur=[];
function closeSearch(){sres.innerHTML='';sres.hidden=true;navEl.hidden=false;sel=-1;cur=[]}
function showSearch(){
  var v=q.value.trim();
  if(v.length<2){closeSearch();return}
  cur=searchRes(v);var top=cur.slice(0,8);sel=top.length?0:-1;
  var h=top.map(function(r,i){return '<a href="#'+r.p+'" class="'+(i===sel?'sel':'')+'">'+r.i+'<span>'+esc(r.t)+'<br><small>'+esc(r.k)+'</small></span></a>'}).join('');
  if(!top.length)h='<p style="font-size:14px;color:var(--ink-soft);margin:4px 8px">Aucun résultat.</p>';
  else if(cur.length>8)h+='<a href="#" class="all" data-all="1">Voir les '+cur.length+' résultats</a>';
  sres.innerHTML=h;sres.hidden=false;navEl.hidden=true;
}
q.addEventListener('input',showSearch);
q.addEventListener('keydown',function(e){
  var links=sres.querySelectorAll('a:not(.all)');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!links.length)return;sel=(sel+(e.key==='ArrowDown'?1:-1)+links.length)%links.length;Array.prototype.forEach.call(links,function(a,i){a.classList.toggle('sel',i===sel)})}
  else if(e.key==='Enter'){if(links[sel]){location.hash=links[sel].getAttribute('href');q.value='';closeSearch();q.blur()}}
  else if(e.key==='Escape'){q.value='';closeSearch()}
});
sres.addEventListener('click',function(e){
  var a=e.target.closest('a');if(!a)return;
  if(a.getAttribute('data-all')){e.preventDefault();var v=q.value.trim();pageEl.innerHTML=searchPage(v);window.scrollTo(0,0);rail.classList.remove('open');return}
  q.value='';closeSearch();
});
document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();rail.classList.add('open');q.focus()}});
document.getElementById('menuBtn').addEventListener('click',function(){var o=rail.classList.toggle('open');this.setAttribute('aria-expanded',String(o))});
var themeBtn=document.getElementById('themeBtn'),modes=['auto','clair','sombre'],mi=0;
try{var m=localStorage.getItem('lb-theme');if(m)mi=Math.max(0,modes.indexOf(m))}catch(e){}
function applyTheme(){var r=document.documentElement;if(modes[mi]==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',modes[mi]==='clair'?'light':'dark');themeBtn.textContent='Thème : '+modes[mi];try{localStorage.setItem('lb-theme',modes[mi])}catch(e){}}
themeBtn.addEventListener('click',function(){mi=(mi+1)%3;applyTheme()});
applyTheme();
route();
})();
</script>
